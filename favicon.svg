<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>

    <!-- Cyan/Blue Cyber Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.3)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Shield Glow -->
  <path d="M256 64 L416 128 V256 C416 362.67 348 436.8 256 464 C164 436.8 96 362.67 96 256 V128 Z" 
        fill="none" stroke="#22d3ee" stroke-width="12" opacity="0.4" filter="url(#glow)"/>

  <!-- Shield Base Contour -->
  <path d="M256 76 L400 136 V252 C400 350 338 420 256 448 C174 420 112 350 112 252 V136 Z" 
        fill="#060e1a" stroke="url(#shieldBorder)" stroke-width="8"/>

  <!-- Inner Cyber Circuit Nodes -->
  <circle cx="256" cy="140" r="6" fill="#22d3ee"/>
  <line x1="256" y1="76" x2="256" y2="140" stroke="#22d3ee" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Monogram Initials "AV" -->
  <g font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Fira Code', sans-serif" font-weight="900" font-size="190" text-anchor="middle" fill="url(#cyanBlueGrad)">
    <!-- Letter A -->
    <path d="M185 340 L235 200 L256 142 L277 200 L327 340 H288 L275 300 H237 L224 340 Z M247 262 H265 L256 230 Z" />
    <!-- Letter V Overlay / Interlocking styling -->
    <path d="M256 360 L290 270 H318 L268 395 L244 395 L194 270 H222 Z" opacity="0.95" fill="url(#cyanBlueGrad)"/>
  </g>

  <!-- Dynamic Security Lock Badge Icon at Shield Center-Bottom -->
  <path d="M256 370 C251 370 247 374 247 379 V387 C243 389 240 393 240 398 C240 405 247 410 256 410 C265 410 272 405 272 398 C272 393 269 389 265 387 V379 C265 374 261 370 256 370 Z M256 376 C258 376 259 377 259 379 V386 H253 V379 C253 377 254 376 256 376 Z" fill="#22d3ee"/>
</svg>
